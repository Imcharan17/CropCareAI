server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: crop-disease-portal

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/crop_disease_portal}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Charan@123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-very-long-secret-key-for-production-please-1234567890}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

  upload-dir: ${UPLOAD_DIR:uploads}

  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://192.168.0.111:5173}

  ai:
    provider: gemini
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.5-flash
      endpoint: https://generativelanguage.googleapis.com/v1beta

springdoc:
  swagger-ui:
    path: /swagger-ui.htm
