spring:
  datasource:
    url: jdbc:h2:file:./data/crop_portal;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect

app:
  ai:
    provider: ${APP_AI_PROVIDER:gemini}

management:
  health:
    mail:
      enabled: false
