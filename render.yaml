databases:
  - name: crop-care-db
    plan: free
    region: singapore

services:
  - type: web
    name: crop-care-frontend
    runtime: docker
    plan: free
    region: singapore
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    envVars:
      - key: FRONTEND_PUBLIC_URL
        fromService:
          type: web
          name: crop-care-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: crop-care-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/actuator/health
    autoDeployTrigger: commit
    envVars:
      # Override the previous `local` profile so the service never selects H2.
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_HOST
        fromDatabase:
          name: crop-care-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: crop-care-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: crop-care-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: crop-care-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: crop-care-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: APP_AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: crop-care-frontend
          envVarKey: RENDER_EXTERNAL_URL
